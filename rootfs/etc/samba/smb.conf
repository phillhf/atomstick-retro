# TV Retro Gaming – Netzwerkfreigaben
# Im Windows-Explorer: \\retro-tv  (Benutzer: retro, Passwort: siehe retro-config.txt)

[global]
   workgroup = WORKGROUP
   server string = TV Retro Gaming
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2_10
   logging = systemd
   log level = 0
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix extensions = no

[roms]
   comment = Spiele (ROMs)
   path = /home/retro/roms
   valid users = retro
   force user = retro
   force group = retro
   read only = no
   create mask = 0644
   directory mask = 0755

[spielstaende]
   comment = Spielstände
   path = /home/retro/saves
   valid users = retro
   force user = retro
   force group = retro
   read only = no
   create mask = 0644
   directory mask = 0755

[bios]
   comment = BIOS-Dateien (optional)
   path = /home/retro/bios
   valid users = retro
   force user = retro
   force group = retro
   read only = no
   create mask = 0644
   directory mask = 0755

[einstellungen]
   comment = retro-config.txt
   path = /boot/retro
   valid users = retro
   force user = retro
   force group = retro
   read only = no
