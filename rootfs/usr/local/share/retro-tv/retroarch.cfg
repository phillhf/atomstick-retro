# TV Retro Gaming – Grundeinstellungen für RetroArch
# Wird beim Bau nach ~/.config/retroarch/retroarch.cfg kopiert. Änderungen im Menü werden dort gespeichert.
# Auflösung und Tonausgabe kommen zusätzlich aus /run/retro-tv (siehe retro-config.txt).

# Sprache und Menü
user_language = "4"
menu_driver = "ozone"
ozone_menu_color_theme = "1"
menu_show_load_core = "false"
menu_show_load_content = "true"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_restart_retroarch = "false"
menu_show_quit_retroarch = "true"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_history = "true"
content_show_favorites = "true"
# Für eine reine Retro-Konsole überflüssige Menüpunkte ausblenden
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_eject_disc = "false"
menu_show_configurations = "false"
desktop_menu_enable = "false"
content_show_explore = "false"
content_show_add_entry = "0"
content_show_contentless_cores = "0"
quit_press_twice = "true"
config_save_on_exit = "true"

# Pfade
assets_directory = "/usr/share/libretro/assets"
libretro_directory = "/usr/lib/x86_64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"
joypad_autoconfig_dir = "/usr/local/share/retro-tv/autoconfig"
playlist_directory = "~/.config/retroarch/playlists"
rgui_browser_directory = "~/roms"
savefile_directory = "~/saves"
savestate_directory = "~/states"
screenshot_directory = "~/screenshots"
system_directory = "~/bios"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"

# Grafik: direkt auf den Bildschirm (KMS), ohne Desktop
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
# Doppelpufferung: wartet auf jeden Bildwechsel, geringere Eingabeverzögerung
video_max_swapchain_images = "2"
video_threaded = "false"
video_smooth = "false"
video_shader_enable = "false"
aspect_ratio_index = "22"
video_font_enable = "true"

# Ton
audio_driver = "alsa"
audio_device = ""
audio_latency = "64"
audio_sync = "true"

# Eingabe
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_max_users = "4"
notification_show_autoconfig = "true"
# Start + Select öffnet im Spiel das Menü
input_menu_toggle_gamepad_combo = "4"
# Escape beendet RetroArch nicht (Beenden = Ausschalten, nur über das Menü)
input_exit_emulator = "nul"
input_menu_toggle = "f1"

# Spielstände: Batteriespeicher alle 10 Sekunden sichern (falls einfach der Strom gezogen wird)
autosave_interval = "10"
savestate_auto_save = "false"
savestate_auto_load = "false"
pause_nonactive = "false"
suspend_screensaver_enable = "true"
